<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - IronForge Gym</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">IronForge Gym</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="support.html" class="active">Support</a></li>
        </ul>
    </nav>

    <div class="support-container">
        <h2>Contact Support</h2>
        <p>Have an issue or a question? Reach out to us.</p>
        <form id="supportForm" class="support-form">
            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="supportSubject" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea id="supportMessage" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn">Submit Ticket</button>
            <p id="supportStatus" class="success-msg"></p>
        </form>
    </div>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
